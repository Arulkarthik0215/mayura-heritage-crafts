<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#F9F6F0"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#E6DCC8" stroke-width="2"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#E6DCC8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Center Icon (Stylized Diya/Lotus) -->
  <g transform="translate(300, 350)">
    <circle cx="0" cy="0" r="60" fill="#F0EBE1"/>
    <path d="M0 -30 C15 -10, 25 10, 0 30 C-25 10, -15 -10, 0 -30 Z" fill="#D4AF37"/>
    <path d="M-20 10 C-35 0, -35 -20, -20 -30 C-10 -15, -5 0, -20 10 Z" fill="#E6DCC8"/>
    <path d="M20 10 C35 0, 35 -20, 20 -30 C10 -15, 5 0, 20 10 Z" fill="#E6DCC8"/>
    <circle cx="0" cy="35" r="4" fill="#D4AF37"/>
  </g>

  <!-- Text -->
  <text x="300" y="470" font-family="Georgia, serif" font-size="32" fill="#4A3F35" text-anchor="middle" font-weight="bold">Mayura Heritage</text>
  <text x="300" y="510" font-family="Arial, sans-serif" font-size="18" fill="#8C7F70" text-anchor="middle" letter-spacing="2">CRAFTS</text>
  
  <rect x="250" y="540" width="100" height="1" fill="#D4AF37"/>
  
  <text x="300" y="580" font-family="Arial, sans-serif" font-size="16" fill="#A89F91" text-anchor="middle" font-style="italic">Image Coming Soon</text>
